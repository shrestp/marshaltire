      pause.addEventListener("click", () => {
        stage.dispatchEvent(new KeyboardEvent("keydown", { key: " ", bubbles: true }));
      });
      stage.addEventListener("keydown", (e) => {
        if (e.key === " ") updatePause();
      });
      document.querySelector("#fullscreen").addEventListener("click", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (e) {
          document.querySelector("#fullscreen").textContent = "Use browser full screen";
        }
      });
      document.addEventListener("fullscreenchange", () => {
        document.querySelector("#fullscreen").textContent = document.fullscreenElement
          ? "Exit full screen"
          : "Full screen";
      });</script></body></html>
